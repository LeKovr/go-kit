services:
  nats:
    image: nats:2.12.6-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel-collector.yaml"]
    env_file:
      - .env
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
      - ./${LOG_DEST:-error.log}:/var/log/observability-example/error.log:ro
      - /:/hostfs:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - openobserve

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve-data:/data

volumes:
  nats-data:
  openobserve-data:
